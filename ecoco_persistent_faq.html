<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOCO FAQ 管理系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ecoco: { orange: '#FF5000', deepBlue: '#060E9F', yellow: '#FFCE00', lightBlue: '#8EB9C9', beige: '#FAE0B8', aqua: '#0076A9' } } } }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .card-animate { transition: transform 0.2s, box-shadow 0.2s; }
        .card-animate:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* Sidebar */
        #faq-sidebar {
            width: 100px; min-width: 100px; background: #060E9F;
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 0 20px; gap: 6px;
            position: sticky; top: 0; height: 100vh; z-index: 40;
        }
        .sb-logo { width: 44px; height: 44px; background: #FF5000; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; font-size: 20px; margin-bottom: 12px; }
        .sb-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 12px; cursor: pointer; width: 76px; transition: background 0.15s; border: none; background: transparent; }
        .sb-btn:hover { background: rgba(255,255,255,0.12); }
        .sb-btn.sb-active { background: rgba(255,255,255,0.2); }
        .sb-btn svg { width: 24px; height: 24px; stroke: rgba(255,255,255,0.5); transition: stroke 0.15s; }
        .sb-btn.sb-active svg, .sb-btn:hover svg { stroke: #fff; }
        .sb-label { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.3; transition: color 0.15s; }
        .sb-btn.sb-active .sb-label, .sb-btn:hover .sb-label { color: #fff; }
        .sb-btn.sb-hot svg { stroke: #fbbf24; }
        .sb-btn.sb-hot .sb-label { color: #fbbf24; }
        .sb-btn.sb-smart svg { stroke: #34d399; }
        .sb-btn.sb-smart .sb-label { color: #34d399; }
        .sb-btn.sb-smart.sb-active { background: rgba(52,211,153,0.15); }
        .sb-btn.sb-ai svg { stroke: #a78bfa; }
        .sb-btn.sb-ai .sb-label { color: #a78bfa; }
        .sb-btn.sb-ai.sb-active { background: rgba(167,139,250,0.15); }
        .sb-divider { width: 50px; height: 1px; background: rgba(255,255,255,0.15); margin: 10px 0; }
        .sb-badge { background: #f59e0b; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 700; min-width: 24px; text-align: center; line-height: 1.6; }

        /* Chip filter bar */
        #chip-bar { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 20px 8px; background: #f8faff; border-bottom: 1px solid #e0e7ff; }
        #chip-bar.visible { display: flex; }
        .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid #c7d2fe; background: #fff; color: #3730a3; transition: all 0.15s; white-space: nowrap; }
        .chip:hover { background: #e0e7ff; border-color: #818cf8; }
        .chip.chip-active { background: #060E9F; color: #fff; border-color: #060E9F; }
        .chip-count { background: rgba(255,255,255,0.25); border-radius: 999px; padding: 1px 7px; font-size: 10px; font-weight: 700; }
        .chip.chip-active .chip-count { background: rgba(255,255,255,0.25); }
        .chip:not(.chip-active) .chip-count { background: #e0e7ff; color: #3730a3; }

        /* Hot Panel */
        #hot-panel { position: fixed; top: 0; left: 100px; width: 360px; height: 100vh; background: #fff; border-right: 1px solid #e2e8f0; z-index: 200; display: none; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.1); }
        #hot-panel.open { display: flex; }

        /* Smart Panel */
        #smart-panel { position: fixed; top: 0; left: 100px; width: 520px; height: 100vh; background: #fff; border-right: 1px solid #e2e8f0; z-index: 200; display: none; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.1); }
        #smart-panel.open { display: flex; }

        /* AI Panel */
        #ai-panel { position: fixed; top: 0; left: 100px; width: 520px; height: 100vh; background: #fff; border-right: 1px solid #e2e8f0; z-index: 200; display: none; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.1); }
        #ai-panel.open { display: flex; }

        #side-overlay { display: none; position: fixed; inset: 0; background: rgba(6,14,159,0.12); z-index: 190; }
        #side-overlay.open { display: block; }

        .hot-card { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 8px; cursor: pointer; background: #fff; transition: border-color 0.15s, background 0.15s; }
        .hot-card:hover { border-color: #060E9F; background: #f0f3ff; }
        .hot-rank { font-size: 16px; font-weight: 700; min-width: 20px; text-align: center; line-height: 1.3; }
        .rank-1 { color: #f59e0b; } .rank-2 { color: #94a3b8; } .rank-3 { color: #b45309; } .rank-n { color: #cbd5e1; font-size: 12px; }
        .hot-title { font-size: 12px; font-weight: 500; color: #1e293b; margin-bottom: 3px; }
        .hot-count { display: inline-flex; align-items: center; gap: 3px; background: #fef3c7; color: #92400e; padding: 1px 7px; border-radius: 999px; font-weight: 600; font-size: 10px; }

        /* Smart match result cards */
        .match-card { border: 1.5px solid #d1fae5; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #fff; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .match-card:hover { border-color: #059669; background: #f0fdf4; }
        .match-score { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #d1fae5; color: #065f46; margin-bottom: 6px; }
        .match-title { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
        .match-preview { font-size: 11px; color: #64748b; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .match-copy-btn { margin-top: 8px; font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #d1fae5; background: #f0fdf4; color: #065f46; cursor: pointer; transition: all 0.15s; }
        .match-copy-btn:hover { background: #059669; color: #fff; border-color: #059669; }

        .panel-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
        .panel-close { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .panel-close:hover { background: rgba(255,255,255,0.25); }

        /* Official FAQ Panel */
        #official-panel { position: fixed; top: 0; left: 100px; width: 380px; height: 100vh; background: #fff; border-right: 1px solid #e2e8f0; z-index: 200; display: none; flex-direction: column; box-shadow: 6px 0 24px rgba(0,0,0,0.1); }
        #official-panel.open { display: flex; }
        .sb-btn.sb-official svg { stroke: #f9a8d4; }
        .sb-btn.sb-official .sb-label { color: #f9a8d4; }
        .sb-btn.sb-official.sb-active { background: rgba(249,168,212,0.15); }
        .official-result { border: 1px solid #fce7f3; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fff; transition: border-color 0.15s, background 0.15s; }
        .official-result:hover { border-color: #ec4899; background: #fdf2f8; }
        .official-q { font-size: 12px; font-weight: 600; color: #1e293b; margin-bottom: 5px; }
        .official-a { font-size: 11px; color: #64748b; line-height: 1.6; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; }
        .official-copy-btn { margin-top: 6px; font-size: 11px; padding: 3px 9px; border-radius: 6px; border: 1px solid #fce7f3; background: #fdf2f8; color: #be185d; cursor: pointer; transition: all 0.15s; }
        .official-copy-btn:hover { background: #ec4899; color: #fff; border-color: #ec4899; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_URL = window.location.origin;

    const COPY_KEY = 'ecoco_copy_counts';
    function getCopyCounts() { try { return JSON.parse(localStorage.getItem(COPY_KEY) || '{}'); } catch { return {}; } }
    function saveCopyCounts(d) { localStorage.setItem(COPY_KEY, JSON.stringify(d)); }

    // Simple keyword match scorer
    function scoreMatch(faq, query) {
        if (!query.trim()) return 0;
        const q = query.toLowerCase();
        const words = q.split(/\s+/).filter(Boolean);
        const fields = [faq.theme||'', faq.main_item||'', faq.sub_item||'', faq.detail||'', faq.content_v1||'', faq.content_v2||''].join(' ').toLowerCase();
        let score = 0;
        words.forEach(w => {
            if (fields.includes(w)) {
                score += (faq.detail||'').toLowerCase().includes(w) ? 3 : 1;
                if ((faq.content_v1||'').toLowerCase().includes(w)) score += 2;
            }
        });
        return score;
    }

    const medals = ['🥇','🥈','🥉'];

    function App() {
        const [faqs, setFaqs] = useState([]);
        const [loading, setLoading] = useState(true);
        const [connected, setConnected] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingFaq, setEditingFaq] = useState(null);
        const [formData, setFormData] = useState({ theme:'', main_item:'', sub_item:'', detail:'', content_v1:'', content_v2:'', images:'', is_archived: 0, note: '' });
        const [guideVisible, setGuideVisible] = useState(true);

        // Batch Edit State
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [batchModalOpen, setBatchModalOpen] = useState(false);
        const [batchData, setBatchData] = useState({ theme: '', main_item: '', sub_item: '' });
        const [batchLoading, setBatchLoading] = useState(false);

        // Sidebar
        const [sidebarMode, setSidebarMode] = useState('all');
        const [activeChip, setActiveChip] = useState(null);
        const [hotOpen, setHotOpen] = useState(false);
        const [smartOpen, setSmartOpen] = useState(false);
        const [copyCounts, setCopyCounts] = useState(getCopyCounts());
        const [smartQuery, setSmartQuery] = useState('');
        const [smartResults, setSmartResults] = useState([]);
        const [gsUrl, setGsUrl] = useState(() => localStorage.getItem('ecoco_gs_url') || '');
        const [gsData, setGsData] = useState([]);
        const [gsLoading, setGsLoading] = useState(false);
        const [fileData, setFileData] = useState([]);
        const [fileLabel, setFileLabel] = useState('');
        const smartRef = useRef(null);
        const importFileRef = useRef(null);
        const [pendingScrollId, setPendingScrollId] = useState(null);
        const [activeSuggestionField, setActiveSuggestionField] = useState(null);

        // TOP button
        const [showTop, setShowTop] = useState(false);

        // Import modal
        const [importOpen, setImportOpen] = useState(false);
        const [importPreview, setImportPreview] = useState([]);
        const [importLoading, setImportLoading] = useState(false);
        const [importResult, setImportResult] = useState(null);

        const [aiOpen, setAiOpen] = useState(false);
        const [aiQuery, setAiQuery] = useState('');
        const [aiResponse, setAiResponse] = useState('');
        const [aiLoading, setAiLoading] = useState(false);
        const [isAiEditing, setIsAiEditing] = useState(false);

        const handleAiSubmit = async () => {
            if(!aiQuery.trim()) return;
            setAiLoading(true);
            setAiResponse('');
            setIsAiEditing(false);
            
            try {
                const r = await fetch(`${API_URL}/api/ai_chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: aiQuery })
                });
                
                const data = await r.json();
                if (r.ok) {
                    setAiResponse(data.response);
                } else {
                    setAiResponse(`❌ 系統提示：${data.detail || '未知錯誤'}\n請確認您已正確設定環境變數 GEMINI_API_KEY。`);
                }
            } catch (err) {
                setAiResponse('❌ 伺服器連線失敗，請檢查後端是否已啟動。');
            } finally {
                setAiLoading(false);
            }
        };

        useEffect(() => { 
            checkConnection(); 
            fetchFaqs(); 
            const savedGsUrl = localStorage.getItem('ecoco_gs_url');
            if (savedGsUrl) { setGsUrl(savedGsUrl); loadGsData(savedGsUrl); }
            const iv = setInterval(checkConnection, 5000); 
            return () => clearInterval(iv); 
        }, []);

        // Fix scroll: watch pendingScrollId and scroll after render
        useEffect(() => {
            if (pendingScrollId === null) return;
            const el = document.getElementById('faq-' + pendingScrollId);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.outline = '3px solid #060E9F';
                el.style.transition = 'outline 0.3s';
                setTimeout(() => { el.style.outline = ''; }, 2200);
                setPendingScrollId(null);
            }
        }, [pendingScrollId, faqs, sidebarMode, searchTerm]);

        // Scroll to top visibility
        useEffect(() => {
            const onScroll = () => setShowTop(window.scrollY > 300);
            window.addEventListener('scroll', onScroll);
            return () => window.removeEventListener('scroll', onScroll);
        }, []);

        const checkConnection = async () => { try { const r = await fetch(`${API_URL}/faqs`); setConnected(r.ok); } catch { setConnected(false); } };
        const fetchFaqs = async () => { setLoading(true); try { const r = await fetch(`${API_URL}/faqs`); if (r.ok) { const d = await r.json(); setFaqs(Array.isArray(d)?d:[]); setSelectedIds(new Set()); } } catch(e){} finally { setLoading(false); } };

        const handleBatchSubmit = async (e) => {
            e.preventDefault();
            if (selectedIds.size === 0) return;
            setBatchLoading(true);
            try {
                // Fetch all selected faqs first to keep original values for empty fields
                const targetFaqs = faqs.filter(f => selectedIds.has(f.id));
                const promises = targetFaqs.map(faq => {
                    const updated = { ...faq };
                    if (batchData.theme.trim()) updated.theme = batchData.theme;
                    if (batchData.main_item.trim()) updated.main_item = batchData.main_item;
                    if (batchData.sub_item.trim()) updated.sub_item = batchData.sub_item;
                    return fetch(`${API_URL}/faqs/${faq.id}`, {
                        method: 'PUT',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(updated)
                    });
                });
                await Promise.all(promises);
                alert(`成功更新 ${promises.length} 筆資料！`);
                setBatchModalOpen(false);
                setBatchData({ theme: '', main_item: '', sub_item: '' });
                fetchFaqs();
            } catch (err) {
                alert("批次更新失敗，請檢查網路連線");
            } finally {
                setBatchLoading(false);
            }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            const method = editingFaq ? 'PUT' : 'POST';
            const url = editingFaq ? `${API_URL}/faqs/${editingFaq.id}` : `${API_URL}/faqs`;
            const today = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/');
            const payload = editingFaq
                ? { ...formData, modified_date: today }
                : formData;
            try {
                const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if (r.ok) { fetchFaqs(); closeModal(); } else { const e = await r.json(); alert(`操作失敗: ${e.detail||'未知錯誤'}`); }
            } catch { alert("操作失敗，請檢查後端連線"); }
        };
        const handleDelete = async (id) => {
            if (!confirm('確定要刪除這條常見問題嗎？')) return;
            try { const r = await fetch(`${API_URL}/faqs/${id}`,{method:'DELETE'}); if(r.ok) fetchFaqs(); else alert("刪除失敗"); } catch { alert("連線失敗"); }
        };
        const openModal = (faq=null) => {
            if (faq) { setEditingFaq(faq); setFormData({theme:faq.theme||'',main_item:faq.main_item||'',sub_item:faq.sub_item||'',detail:faq.detail||'',content_v1:faq.content_v1||'',content_v2:faq.content_v2||'',images:faq.images||'',is_archived:faq.is_archived||0,note:faq.note||''}); }
            else { setEditingFaq(null); setFormData({theme:'',main_item:'',sub_item:'',detail:'',content_v1:'',content_v2:'',images:'',is_archived:0,note:''}); }
            setIsModalOpen(true);
        };
        const closeModal = () => { setIsModalOpen(false); setEditingFaq(null); setActiveSuggestionField(null); };

        const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 3 * 1024 * 1024) {
                alert('為避免資料庫過大，請上傳 3MB 以下的圖片檔案');
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                const base64 = ev.target.result;
                setFormData(prev => ({
                    ...prev,
                    images: prev.images ? prev.images + ' ' + base64 : base64
                }));
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        };

        const handleArchive = async (faq) => {
            const newStatus = faq.is_archived === 1 ? 0 : 1;
            const action = newStatus === 1 ? '封存' : '解除封存';
            if (!confirm(`確定要${action}這條常見問題嗎？`)) return;
            try {
                const r = await fetch(`${API_URL}/faqs/${faq.id}`, {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({...faq, is_archived: newStatus})
                });
                if (r.ok) fetchFaqs(); else alert("操作失敗");
            } catch { alert("連線失敗"); }
        };

        const copyToClipboard = (text, faqId, label) => {
            if (!text) return;
            navigator.clipboard.writeText(text);
            alert('已複製到剪貼簿');
            const counts = getCopyCounts();
            if (!counts[faqId]) counts[faqId] = { label, count: 0 };
            counts[faqId].count += 1; counts[faqId].label = label;
            saveCopyCounts(counts); setCopyCounts({...counts});
        };
        const copyRowForSheet = (faq) => {
            const row = [faq.theme||'',faq.main_item||'',faq.sub_item||'',faq.detail||'',faq.content_v1||'',faq.content_v2||'',faq.created_date||''].join('\t');
            navigator.clipboard.writeText(row); alert('已複製整列資料 (適用於 Google Sheet 貼上)');
        };

        // ── Import functions ──
        const downloadTemplate = () => {
            const csv = '\uFEFF' + '主題,主項目,小項目,細項,標準回覆(V1),備用英文(V2)\n' +
                '"APP2.0","登入與帳號","繁體版","無法收到簡訊驗證碼","親愛的會員您好，若未收到驗證碼請確認手機是否封鎖行銷簡訊。","Dear member, please check if your phone blocks marketing SMS."\n';
            const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'ECOCO_FAQ_匯入範本.csv'; a.click();
            URL.revokeObjectURL(url);
        };

        const handleImportFile = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const text = ev.target.result;
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) { alert('檔案內容不足，至少需要標題列和一筆資料'); return; }
                    const sep = lines[0].includes('\t') ? '\t' : ',';
                    const parseRow = (line) => {
                        if (sep === '\t') return line.split('\t').map(v => v.trim());
                        const result = []; let cur = ''; let inQ = false;
                        for (let i = 0; i < line.length; i++) {
                            if (line[i] === '"') { inQ = !inQ; }
                            else if (line[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
                            else { cur += line[i]; }
                        }
                        result.push(cur.trim()); return result;
                    };
                    const headers = parseRow(lines[0]);
                    const colMap = {};
                    const colNames = {
                        theme: ['主題','theme','Theme'],
                        main_item: ['主項目','項目','main_item','Main Item'],
                        sub_item: ['小項目','版本','sub_item','Sub Item'],
                        detail: ['細項','問題','detail','Detail'],
                        content_v1: ['標準回覆','內容版本1','V1','content_v1','Content V1'],
                        content_v2: ['備用英文','內容版本2','V2','content_v2','Content V2'],
                    };
                    headers.forEach((h, i) => {
                        Object.entries(colNames).forEach(([key, names]) => {
                            if (names.some(n => h.includes(n))) colMap[key] = i;
                        });
                    });
                    if (colMap.theme === undefined) { alert('找不到「主題」欄位，請確認第一列有欄位名稱'); return; }
                    const rows = lines.slice(1).map(line => {
                        const cols = parseRow(line);
                        return {
                            theme: cols[colMap.theme] || '',
                            main_item: colMap.main_item !== undefined ? cols[colMap.main_item] || '' : '',
                            sub_item: colMap.sub_item !== undefined ? cols[colMap.sub_item] || '' : '',
                            detail: colMap.detail !== undefined ? cols[colMap.detail] || '' : '',
                            content_v1: colMap.content_v1 !== undefined ? cols[colMap.content_v1] || '' : '',
                            content_v2: colMap.content_v2 !== undefined ? cols[colMap.content_v2] || '' : '',
                        };
                    }).filter(r => r.theme);
                    setImportPreview(rows); setImportResult(null);
                } catch { alert('解析失敗，請確認檔案格式正確'); }
            };
            reader.readAsText(file, 'UTF-8'); e.target.value = '';
        };

        const handleImportSubmit = async () => {
            if (!importPreview.length) return;
            setImportLoading(true); let success = 0; let failed = 0;
            for (const row of importPreview) {
                try {
                    const r = await fetch(`${API_URL}/faqs`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(row) });
                    if (r.ok) success++; else failed++;
                } catch { failed++; }
            }
            setImportLoading(false); setImportResult({ success, failed });
            if (success > 0) fetchFaqs();
        };

        const exportCSV = () => {
            if (faqs.length === 0) { alert('目前沒有資料可以匯出'); return; }
            const headers = ['主題','主項目','小項目','細項','標準回覆(V1)','備用英文(V2)','建立日期'];
            const rows = faqs.map(f => [
                f.theme||'', f.main_item||'', f.sub_item||'', f.detail||'',
                (f.content_v1||'').replace(/"/g,'""').replace(/\n/g,' '),
                (f.content_v2||'').replace(/"/g,'""').replace(/\n/g,' '),
                f.created_date||''
            ].map(v => `"${v}"`).join(','));
            const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ECOCO_FAQ_${new Date().toISOString().slice(0,10)}.csv`;
            a.click(); URL.revokeObjectURL(url);
        };

        const exportExcel = () => {
            if (faqs.length === 0) { alert('目前沒有資料可以匯出'); return; }
            const headers = ['主題','主項目','小項目','細項','標準回覆(V1)','備用英文(V2)','建立日期'];
            const rows = faqs.map(f => [
                f.theme||'', f.main_item||'', f.sub_item||'', f.detail||'',
                f.content_v1||'', f.content_v2||'', f.created_date||''
            ]);
            // Build XML-based Excel (xls)
            let xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Worksheet ss:Name="ECOCO FAQ"><Table>`;
            const toCell = (v) => `<Cell><Data ss:Type="String">${String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</Data></Cell>`;
            xml += '<Row>' + headers.map(toCell).join('') + '</Row>';
            rows.forEach(r => { xml += '<Row>' + r.map(toCell).join('') + '</Row>'; });
            xml += '</Table></Worksheet></Workbook>';
            const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ECOCO_FAQ_${new Date().toISOString().slice(0,10)}.xls`;
            a.click(); URL.revokeObjectURL(url);
        };

            .card-header{background:#f8fafc;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;gap:8px}
            .tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px}
            .tag-theme{background:#e0e7ff;color:#3730a3}.tag-item{background:#cffafe;color:#0e7490}.tag-ver{background:#dbeafe;color:#1d4ed8}
            .card-meta{font-size:10px;color:#94a3b8}.card-title{padding:10px 16px 8px;font-size:14px;font-weight:700;color:#060E9F}
            .content-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
            .content-box{padding:10px 16px 14px;border-top:1px solid #f1f5f9}.content-box:nth-child(2){border-left:1px solid #f1f5f9}
            .content-label{font-size:10px;font-weight:800;margin-bottom:6px;padding:2px 8px;border-radius:4px;display:inline-block}
            .v1{background:#FF5000;color:white}.v2{background:#0076A9;color:white}
            .content-text{font-size:11px;color:#475569;line-height:1.7}
            @media print{body{background:white}.page-header,.tag,.content-label{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{page-break-inside:avoid}}
            </style></head><body>
            <div class="page-header"><div><h1>ECOCO FAQ Assistant</h1><div style="font-size:11px;opacity:.7;margin-top:4px">Knowledge Base Management</div></div>
            <div class="meta">匯出日期：${date}<br>共 ${filteredFaqs.length} 筆問答</div></div>
            <div class="summary">共匯出 <strong>${filteredFaqs.length}</strong> 筆 FAQ 內容${activeChip?`　篩選條件：${activeChip}`:''}</div>
            <div class="cards">${cards}</div></body></html>`;
            const w = window.open('','_blank');
            w.document.write(html); w.document.close();
            setTimeout(()=>{ w.focus(); w.print(); }, 600);

        // Chip options from current faqs
        const chipOptions = useMemo(() => {
            if (sidebarMode === 'all' || sidebarMode === 'hot' || sidebarMode === 'archive') return [];
            const field = sidebarMode === 'theme' ? 'theme' : sidebarMode === 'item' ? 'main_item' : 'sub_item';
            const counts = {};
            faqs.filter(f => f.is_archived !== 1).forEach(f => { const v = f[field]; if (v) counts[v] = (counts[v]||0)+1; });
            return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([val,cnt])=>({val,cnt}));
        }, [faqs, sidebarMode]);

        // Filtered faqs
        const filteredFaqs = useMemo(() => {
            let result = faqs.filter(faq =>
                [faq.theme,faq.content_v1,faq.content_v2,faq.main_item,faq.detail,faq.sub_item].some(f=>(f||'').toLowerCase().includes(searchTerm.toLowerCase()))
            );
            if (sidebarMode === 'archive') {
                result = result.filter(f => f.is_archived === 1);
            } else {
                result = result.filter(f => f.is_archived !== 1);
                if (activeChip) {
                    const field = sidebarMode === 'theme' ? 'theme' : sidebarMode === 'item' ? 'main_item' : 'sub_item';
                    result = result.filter(f => f[field] === activeChip);
                }

            return result;
        }, [faqs, searchTerm, activeChip, sidebarMode]);

        // Hot list
        const hotList = useMemo(() => Object.entries(copyCounts).map(([id,v])=>({id,label:v.label,count:v.count})).sort((a,b)=>b.count-a.count), [copyCounts]);

        // Smart match
        const runSmartMatch = (q) => {
            setSmartQuery(q);
            if (!q.trim()) { setSmartResults([]); return; }
            const scored = faqs.map(f=>({faq:f, score:scoreMatch(f,q)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
            setSmartResults(scored);
        };

        const setSidebarNav = (mode) => {

            setHotOpen(false); setSmartOpen(false); setAiOpen(false);

        const closePanel = () => { setHotOpen(false); setSmartOpen(false); setAiOpen(false); };

        const scrollToFaq = (faqId) => {

        // Load Google Sheet CSV via XLSX to handle multi-line cells correctly
        const loadGsData = async (url) => {
            if (!url.trim()) return;
            setGsLoading(true);
            try {
                let fetchUrl = url;
                if (url.includes('docs.google.com/spreadsheets')) {
                    const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    if (match) {
                        const sheetId = match[1];
                        const gidMatch = url.match(/gid=([0-9]+)/);
                        const gid = gidMatch ? gidMatch[1] : '0';
                        fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
                    }
                }
                const res = await fetch(fetchUrl);
                if (!res.ok) throw new Error('Network response was not ok');
                const text = await res.text();
                const wb = window.XLSX.read(text, {type: 'string'});
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const rows = window.XLSX.utils.sheet_to_json(ws, {defval: ''});
                setGsData(rows);
                localStorage.setItem('ecoco_gs_url', url);
            } catch(e) { alert('載入失敗，請確認網址是否為公開的 Google Sheet 或格式正確'); }
            finally { setGsLoading(false); }
        };

        // Load file (XLSX, XLS, CSV)
        const loadFile = (file) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = window.XLSX.read(data, {type: 'array'});
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const rows = window.XLSX.utils.sheet_to_json(ws, {defval: ''});
                    setFileData(rows);
                    setFileLabel(file.name + ' (' + rows.length + ' 筆)');
                } catch(err) { alert('檔案解析失敗，請確認檔案格式是否正確'); }
            };
            reader.readAsArrayBuffer(file);
        };

        const modeLabel = { theme:'主題', item:'項目', version:'版本', archive:'封存' };

        return (

                        <span className="sb-label">主題</span>

                        <span className="sb-label">版本</span>
                    </button>

                    <button className={`sb-btn ${sidebarMode==='archive'&&!hotOpen&&!smartOpen?'sb-active':''}`} onClick={()=>setSidebarNav('archive')}>
                        <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.6"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>
                        <span className="sb-label">封存</span>
                    </button>

                    <div className="sb-divider"></div>

                    {/* Smart match */}
                    <button className={`sb-btn sb-smart ${smartOpen?'sb-active':''}`} onClick={toggleSmart}>
                        <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg>
                        <span className="sb-label">智能比對</span>

                <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>

                                    <ul className="list-none space-y-2 text-sm text-gray-700">

                                </button>
                                <button onClick={()=>{setImportOpen(true);setImportPreview([]);setImportResult(null);}} className="bg-white text-ecoco-deepBlue px-4 py-4 rounded-2xl border border-gray-100 shadow-sm hover:bg-gray-50 transition-all flex items-center space-x-2 whitespace-nowrap" title="批次匯入">

                                </button>
                                <input ref={importFileRef} type="file" accept=".csv,.tsv,.txt" style={{display:'none'}} onChange={handleImportFile} />
                                <button onClick={exportCSV} className="bg-white text-ecoco-deepBlue px-4 py-4 rounded-2xl border border-gray-100 shadow-sm hover:bg-gray-50 transition-all flex items-center space-x-2 whitespace-nowrap" title="匯出 CSV">

                                            const getYTId = url => { const m = url.match(/(?:v=|youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=))([a-zA-Z0-9_-]{11})/i); return m?m[1]:null; };

                                                                            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.25)'}}>
                                                                                <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
                                                                            </div>
                                                                        </div>
                                                                    </a>
                                                                ) : null;
                                                            } else {
                                                                let previewUrl = url;
                                                                const gdriveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
                                                                if (gdriveMatch) previewUrl = `https://drive.google.com/uc?id=${gdriveMatch[1]}`;
                                                                return (
                                                                    <a key={i} href={url} target="_blank" rel="noreferrer" style={{display:'block',flexShrink:0,position:'relative'}} className="group" title={url}>

                                                                            <img src={previewUrl} alt="附圖" style={{width:'100%',height:'100%',objectFit:'cover'}} onError={(e)=>{ e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}/>
                                                                            <div style={{display:'none',flexDirection:'column',alignItems:'center',justifyContent:'center',width:'100%',height:'100%',padding:4,boxSizing:'border-box'}}>

                                                                                <span style={{fontSize:9,color:'#6366f1',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',width:'100%',textAlign:'center'}}>{url.replace(/^https?:\/\//,'')}</span>
                                                                            </div>
                                                                        </div>
                                                                    </a>
                                                                );
                                                            }
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })()}

                                                <i className="fas fa-file-export"></i><span>複製整列 (Google Sheet 格式)</span>
                                            </button>
                                        </div>

                                <h3 className="text-2xl font-bold text-ecoco-deepBlue/40">{searchTerm||activeChip?'無相符結果':'探索新的問題'}</h3>

                                                    onBlur={()=>setActiveSuggestionField(null)}

                                                                    content_v1: f.content_v1||'',
                                                                    content_v2: f.content_v2||'',
                                                                    images: f.images||'',

                                                    <span className="match-score">相關度 {Math.min(100,score*10)}%</span>
                                                    <div className="match-title">{faq.detail || faq.theme}</div>
                                                    <div style={{fontSize:11,color:'#94a3b8',marginBottom:4}}>{[faq.theme,faq.main_item,faq.sub_item].filter(Boolean).join(' › ')}</div>
                                                    <div className="match-preview">{faq.content_v1||'（尚無內容）'}</div>
                                                    <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
                                                        <button className="match-copy-btn" onClick={()=>copyToClipboard(faq.content_v1,faq.id,faq.detail||faq.theme)}>複製 V1</button>
                                                        {faq.content_v2 && <button className="match-copy-btn" onClick={()=>copyToClipboard(faq.content_v2,faq.id,faq.detail||faq.theme)}>複製 V2</button>}
                                                        <button className="match-copy-btn" style={{borderColor:'#c7d2fe',background:'#f5f3ff',color:'#3730a3'}} onClick={()=>scrollToFaq(faq.id)}>跳至卡片</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </>
                                    )}
                                    {/* 檔案結果 */}
                                    {fileResults.length>0 && (() => {
                                        const cols = Object.keys(fileResults[0]);
                                        return (
                                            <>
                                                <p style={{fontSize:11,color:'#d97706',fontWeight:600,marginBottom:6,marginTop:hasKb?14:0}}>📂 檔案結果: {fileResults.length} 筆</p>
                                                {fileResults.map((row,i)=>(
                                                    <div key={i} className="official-result" style={{borderColor:'#fde68a',background:'#fffbeb'}}>
                                                        <div className="official-q" style={{color:'#92400e'}}>{row[cols[0]]||'—'}</div>
                                                        <div className="official-a">{cols.slice(1).map(c=>row[c]).filter(Boolean).join(' | ')}</div>
                                                        <button className="official-copy-btn" style={{borderColor:'#fde68a',background:'#fffbeb',color:'#92400e'}} onClick={()=>navigator.clipboard.writeText(Object.values(row).filter(Boolean).join('\n')).then(()=>alert('已複製'))}>複製內容</button>
                                                    </div>
                                                ))}
                                            </>
                                        );
                                    })()}
                                    {/* Google Sheet 結果 */}
                                    {gsResults.length>0 && (() => {
                                        const cols = Object.keys(gsResults[0]);
                                        return (
                                            <>
                                                <p style={{fontSize:11,color:'#065f46',fontWeight:600,marginBottom:6,marginTop:(hasKb||fileResults.length>0)?14:0}}>🌐 Google Sheet: {gsResults.length} 筆</p>
                                                {gsResults.map((row,i)=>(
                                                    <div key={i} className="official-result">
                                                        <div className="official-q">{row[cols[0]]||'—'}</div>
                                                        <div className="official-a">{cols.slice(1).map(c=>row[c]).filter(Boolean).join(' | ')}</div>
                                                        <button className="official-copy-btn" onClick={()=>navigator.clipboard.writeText(Object.values(row).filter(Boolean).join('\n')).then(()=>alert('已複製'))}>複製內容</button>
                                                    </div>
                                                ))}
                                            </>
                                        );
                                    })()}
                                </>
                            );
                        })()}
                    </div>
                </div>

            {/* ── Import Modal ── */}
            {importOpen && (
                <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(6,14,159,0.18)',backdropFilter:'blur(4px)'}}>
                    <div style={{background:'#fff',borderRadius:24,width:'100%',maxWidth:680,maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.15)'}}>
                        <div style={{background:'#060E9F',borderRadius:'24px 24px 0 0',padding:'18px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                            <div style={{color:'#fff',fontWeight:700,fontSize:16,display:'flex',alignItems:'center',gap:10}}>
                                <i className="fas fa-file-import"></i> Excel / CSV 批次匯入
                            </div>
                            <button onClick={()=>setImportOpen(false)} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:30,height:30,borderRadius:8,cursor:'pointer',fontSize:16}}>✕</button>
                        </div>
                        <div style={{padding:'20px 24px'}}>
                            {/* Step 1 */}
                            <div style={{background:'#f0f4ff',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                                <div>
                                    <div style={{fontWeight:600,fontSize:13,color:'#3730a3',marginBottom:3}}>第一步：下載範本</div>
                                    <div style={{fontSize:12,color:'#6366f1'}}>使用標準欄位格式，避免匯入錯誤</div>
                                </div>
                                <button onClick={downloadTemplate} style={{background:'#060E9F',color:'#fff',border:'none',borderRadius:8,padding:'8px 16px',fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                                    <i className="fas fa-download"></i> 下載範本
                                </button>
                            </div>
                            {/* Step 2 */}
                            <div style={{marginBottom:16}}>
                                <div style={{fontWeight:600,fontSize:13,color:'#1e293b',marginBottom:8}}>第二步：上傳 CSV 檔案</div>
                                <div style={{border:'2px dashed #c7d2fe',borderRadius:12,padding:'20px',textAlign:'center',background:'#f8faff',cursor:'pointer'}}
                                    onClick={()=>importFileRef.current&&importFileRef.current.click()}>
                                    <i className="fas fa-cloud-upload-alt" style={{fontSize:28,color:'#818cf8',marginBottom:8,display:'block'}}></i>
                                    <div style={{fontSize:13,color:'#6366f1',fontWeight:600}}>點擊選擇 CSV 檔案</div>
                                    <div style={{fontSize:11,color:'#94a3b8',marginTop:4}}>支援 .csv 格式（Excel 另存為 CSV UTF-8 即可）</div>
                                </div>
                            </div>
                            {/* Step 3: Preview */}
                            {importPreview.length > 0 && !importResult && (
                                <div style={{marginBottom:16}}>
                                    <div style={{fontWeight:600,fontSize:13,color:'#1e293b',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                                        第三步：確認資料預覽
                                        <span style={{background:'#d1fae5',color:'#065f46',fontSize:11,padding:'2px 8px',borderRadius:999,fontWeight:700}}>{importPreview.length} 筆</span>
                                    </div>
                                    <div style={{maxHeight:240,overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:10}}>
                                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                                            <thead>
                                                <tr style={{background:'#f8fafc',position:'sticky',top:0}}>
                                                    {['主題','主項目','小項目','細項','V1 標準回覆','V2 備用'].map(h=>(
                                                        <th key={h} style={{padding:'8px 10px',textAlign:'left',fontWeight:700,color:'#475569',borderBottom:'1px solid #e2e8f0',whiteSpace:'nowrap'}}>{h}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {importPreview.map((row,i)=>(
                                                    <tr key={i} style={{borderBottom:'1px solid #f1f5f9',background:i%2===0?'#fff':'#f8fafc'}}>
                                                        {[row.theme,row.main_item,row.sub_item,row.detail,row.content_v1,row.content_v2].map((v,j)=>(
                                                            <td key={j} style={{padding:'7px 10px',color:'#334155',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={v}>{v||'-'}</td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div style={{display:'flex',gap:10,marginTop:12,justifyContent:'flex-end'}}>
                                        <button onClick={()=>setImportPreview([])} style={{padding:'9px 20px',borderRadius:10,border:'1.5px solid #e2e8f0',background:'#fff',color:'#64748b',fontSize:13,fontWeight:600,cursor:'pointer'}}>重新選擇</button>
                                        <button onClick={handleImportSubmit} disabled={importLoading} style={{padding:'9px 24px',borderRadius:10,border:'none',background:'#060E9F',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
                                            {importLoading ? <><i className="fas fa-spinner fa-spin"></i> 匯入中...</> : <><i className="fas fa-check"></i> 確認匯入 {importPreview.length} 筆</>}
                                        </button>
                                    </div>
                                </div>
                            )}
                            {/* Result */}
                            {importResult && (
                                <div style={{background:importResult.failed===0?'#f0fdf4':'#fffbeb',border:`1.5px solid ${importResult.failed===0?'#bbf7d0':'#fde68a'}`,borderRadius:12,padding:'16px 20px',textAlign:'center'}}>
                                    <i className={`fas ${importResult.failed===0?'fa-check-circle':'fa-exclamation-circle'}`} style={{fontSize:28,color:importResult.failed===0?'#22c55e':'#f59e0b',marginBottom:8,display:'block'}}></i>
                                    <div style={{fontWeight:700,fontSize:15,color:'#1e293b',marginBottom:4}}>匯入完成！</div>
                                    <div style={{fontSize:13,color:'#475569'}}>成功：<strong style={{color:'#22c55e'}}>{importResult.success} 筆</strong>　失敗：<strong style={{color:'#ef4444'}}>{importResult.failed} 筆</strong></div>
                                    <button onClick={()=>setImportOpen(false)} style={{marginTop:14,padding:'9px 28px',borderRadius:10,border:'none',background:'#060E9F',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>關閉</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}

            {/* ── Scroll to Top ── */}
            {showTop && (
                <button
                    onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}
                    style={{position:'fixed',bottom:28,right:28,zIndex:300,width:48,height:48,borderRadius:'50%',background:'#060E9F',color:'#fff',border:'none',cursor:'pointer',boxShadow:'0 4px 16px rgba(6,14,159,0.35)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,transition:'background 0.2s'}}
                    title="回到頂部"
                    onMouseEnter={e=>e.currentTarget.style.background='#FF5000'}
                    onMouseLeave={e=>e.currentTarget.style.background='#060E9F'}
                >
                    <i className="fas fa-chevron-up"></i>
                </button>
            )}

            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // ── Import Modal & TOP button (rendered outside React via portal) ──
    // These are rendered inside App's return, injected via the state above.
</script>
</body>
</html>
